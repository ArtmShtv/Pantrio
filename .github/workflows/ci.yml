name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check --output-format=github .

      - run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pantrio
          POSTGRES_PASSWORD: pantrio
          POSTGRES_DB: pantrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantrio -d pantrio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key
      POSTGRES_USER: pantrio
      POSTGRES_PASSWORD: pantrio
      POSTGRES_DB: pantrio_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      SESSION_SECRET: ci-session-secret-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Downgrade and re-upgrade migrations
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pantrio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max